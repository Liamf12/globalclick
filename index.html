<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GLOBAL CLICK</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="bg"></div>
  <header>
    <div>
      <div class="logo">GLOBAL<span>CLICK</span></div>
      <div class="subtitle">ONE WORLD. ONE COUNTER.</div>
    </div>
    <div class="online"><i></i><span id="online">—</span> ONLINE</div>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">COMMUNITY TOTAL</div>
      <div id="globalClicks" class="global-number">0</div>
      <div class="label">TOTAL GLOBAL CLICKS</div>
      <div class="stats">
        <div><b id="cpc">1</b><span>CLICKS / CLICK</span></div>
        <div><b id="cps">0</b><span>GLOBAL CLICKS / SEC</span></div>
        <div><b id="players">0</b><span>CLICKS MADE BY YOU</span></div>
      </div>
    </section>

    <section class="game-grid">
      <div class="click-panel">
        <div class="progress"><span id="milestoneText">Next milestone</span><span id="milestonePct">0%</span></div>
        <div class="bar"><div id="barFill"></div></div>
        <button id="clickBtn" class="click-button">
          <span class="click-ring"></span>
          <span class="click-icon">✦</span>
          <strong>CLICK</strong>
          <small>+<span id="buttonPower">1</span> GLOBAL CLICKS</small>
        </button>
        <div id="feed" class="feed"></div>
      </div>

      <aside class="shop">
        <div class="shop-title">
          <div><span class="eyebrow">UPGRADES</span><h2>POWER SHOP</h2></div>
          <div class="wallet">YOUR CLICKS <b id="wallet">0</b></div>
        </div>
        <div id="upgrades"></div>
      </aside>
    </section>

    <section class="milestones">
      <div class="section-heading"><span class="eyebrow">GLOBAL MILESTONES</span><h2>THE COMMUNITY RACE</h2></div>
      <div id="milestoneCards" class="milestone-cards"></div>
    </section>
  </main>

  <footer>GLOBAL CLICK • Community state is shared in real time • <span id="status">CONNECTING…</span></footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
